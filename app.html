<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <Title>Wheel picker</Title>
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <script src="./src/app.js"></script>
    <div class="container">
      <div class="wheel">
        <ul class="wheel-list">
          
        </ul>
      </div>
      <div class="controls">
        <input type="text" class="item-input" placeholder="Add/Remove item" />
        <button class="add-item">Add item</button>
        <button class="remove-item">Remove item</button>
        <button class="spin-wheel">Spin wheel</button>
    </div>
  </body>
</html>
